<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Lever with fulcrum (Moment) -->
  <!-- Fulcrum triangle -->
  <polygon points="50,56 42,72 58,72" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <!-- Lever bar tilted -->
  <line x1="18" y1="48" x2="82" y2="60" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
  <!-- Weights -->
  <rect x="20" y="36" width="12" height="12" rx="2" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="68" y="52" width="14" height="14" rx="2" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>

</svg>