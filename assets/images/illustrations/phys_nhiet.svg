<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Sun / Heat Conduction / Flame -->
  <circle cx="50" cy="50" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Sun rays / heat waves -->
  <line x1="50" y1="22" x2="50" y2="14" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="50" y2="86" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="14" y2="50" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="86" y2="50" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <!-- Waves inside -->
  <path d="M44 46 Q47 42 50 46 T56 46" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M44 54 Q47 50 50 54 T56 54" fill="none" stroke="#ffffff" stroke-width="2"/>

</svg>