<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Pressure piston pushing down (p = F/S) -->
  <rect x="24" y="36" width="52" height="42" fill="#134e4a" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Piston -->
  <rect x="26" y="38" width="48" height="10" rx="2" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Force arrow -->
  <line x1="50" y1="20" x2="50" y2="36" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <polygon points="50,40 44,32 56,32" fill="#ef4444"/>
  <text x="36" y="64" fill="#ffffff" font-size="13" font-weight="bold" font-family="Arial">p=F/S</text>

</svg>