<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Calculator & Fraction formula -->
  <rect x="22" y="24" width="56" height="56" rx="8" fill="#4c1d95" stroke="#ffffff" stroke-width="3"/>
  <rect x="30" y="32" width="40" height="14" rx="3" fill="#a78bfa"/>
  <text x="34" y="43" fill="#1e1b4b" font-size="10" font-weight="bold" font-family="monospace">n=m/M</text>
  <!-- Keys -->
  <circle cx="36" cy="56" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="56" r="3.5" fill="#ffffff"/>
  <circle cx="64" cy="56" r="3.5" fill="#facc15"/>
  <circle cx="36" cy="68" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="68" r="3.5" fill="#ffffff"/>
  <circle cx="64" cy="68" r="3.5" fill="#22c55e"/>

</svg>