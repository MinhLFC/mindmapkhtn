<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#a5b4fc" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Lightbulb glowing on circuit -->
  <!-- Bulb -->
  <circle cx="50" cy="44" r="16" fill="#facc15" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="44" y="60" width="12" height="8" rx="2" fill="#cbd5e1" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Glow rays -->
  <line x1="50" y1="20" x2="50" y2="14" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="28" x2="22" y2="22" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="28" x2="78" y2="22" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  <!-- Filament -->
  <path d="M46 48 L48 40 L52 40 L54 48" fill="none" stroke="#ca8a04" stroke-width="2"/>

</svg>