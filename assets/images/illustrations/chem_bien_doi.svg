<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Reversible / transformation cycle -->
  <path d="M30 50 A 22 22 0 0 1 68 34" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="68,28 76,34 68,40" fill="#ffffff"/>
  <path d="M70 50 A 22 22 0 0 1 32 66" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="32,72 24,66 32,60" fill="#fef08a"/>
  <!-- Molecules inside -->
  <circle cx="38" cy="42" r="6" fill="#38bdf8"/>
  <circle cx="48" cy="38" r="4" fill="#ef4444"/>
  <circle cx="62" cy="58" r="7" fill="#fbbf24"/>

</svg>