<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#a5f3fc" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Salt crystal cube (NaCl) -->
  <!-- 3D Cube -->
  <polygon points="50,22 76,34 50,46 24,34" fill="#67e8f9" stroke="#ffffff" stroke-width="2"/>
  <polygon points="24,34 50,46 50,76 24,64" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <polygon points="50,46 76,34 76,64 50,76" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
  <!-- Ions -->
  <circle cx="50" cy="46" r="4" fill="#facc15"/>
  <circle cx="76" cy="34" r="3.5" fill="#ffffff"/>
  <circle cx="24" cy="34" r="3.5" fill="#ffffff"/>

</svg>