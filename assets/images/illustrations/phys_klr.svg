<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#7dd3fc" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Solid block in measuring cylinder (D = m/V) -->
  <rect x="24" y="26" width="30" height="52" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Liquid -->
  <rect x="25" y="48" width="28" height="29" fill="#38bdf8"/>
  <!-- Submerged Cube -->
  <rect x="33" y="54" width="12" height="12" rx="1" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Formula -->
  <text x="60" y="44" fill="#ffffff" font-size="14" font-weight="bold" font-family="Arial">D=</text>
  <text x="76" y="38" fill="#facc15" font-size="13" font-weight="bold" font-family="Arial">m</text>
  <line x1="75" y1="41" x2="87" y2="41" stroke="#ffffff" stroke-width="2"/>
  <text x="77" y="54" fill="#facc15" font-size="13" font-weight="bold" font-family="Arial">V</text>

</svg>