<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Battery & Spark -->
  <rect x="22" y="34" width="38" height="42" rx="6" fill="#14b8a6" fill-opacity="0.3" stroke="#ffffff" stroke-width="3"/>
  <rect x="33" y="27" width="16" height="7" rx="2" fill="#ffffff"/>
  <!-- Plus / Minus -->
  <text x="32" y="52" fill="#fef08a" font-size="16" font-weight="bold" font-family="Arial">+</text>
  <text x="33" y="68" fill="#ffffff" font-size="18" font-weight="bold" font-family="Arial">-</text>
  <!-- Lightning bolt -->
  <polygon points="68,22 55,48 66,48 60,78 78,44 67,44" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>

</svg>