<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bgGrad)" stroke="#7dd3fc" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Beaker with measurement lines -->
  <rect x="25" y="30" width="36" height="48" rx="4" fill="#38bdf8" fill-opacity="0.25" stroke="#ffffff" stroke-width="3"/>
  <line x1="22" y1="30" x2="30" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="42" x2="42" y2="42" stroke="#fef08a" stroke-width="2"/>
  <line x1="30" y1="52" x2="46" y2="52" stroke="#fef08a" stroke-width="2"/>
  <line x1="30" y1="62" x2="42" y2="62" stroke="#fef08a" stroke-width="2"/>
  <!-- Thermometer -->
  <rect x="68" y="24" width="8" height="42" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
  <circle cx="72" cy="70" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <rect x="70.5" y="34" width="3" height="32" rx="1.5" fill="#ef4444"/>

</svg>